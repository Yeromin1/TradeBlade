<!doctype html>
<html lang="ru">
  <head>
    <load src="./components/head/head.html" />

    <title>TradeBlade</title>

    <link rel="stylesheet" href="./css/styles.css" />

    <style>
      .preloader {
        background: black;
        left: 0;
        position: fixed;
        width: 100vw;
        height: 100vh;
        top: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .preloader svg {
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: drawText 3s ease forwards;
        text-transform: uppercase;
      }

      @keyframes drawText {
        to {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="preloader">
      <svg width="250" height="55" xmlns="http://www.w3.org/2000/svg">
        <text
          x="10"
          y="50"
          font-size="40"
          font-family="Arial"
          font-weight="bold"
          stroke="var(--q)"
          fill="none"
          stroke-width="1.5"
          class="animated-text"
        >
          Hello I AM
        </text>
      </svg>
      <svg width="250" height="55" xmlns="http://www.w3.org/2000/svg">
        <text
          x="10"
          y="50"
          font-size="40"
          font-family="Arial"
          font-weight="bold"
          stroke="var(--q)"
          fill="none"
          stroke-width="1.5"
          class="animated-text"
        >
          FullStack
        </text>
      </svg>
      <svg width="260" height="55" xmlns="http://www.w3.org/2000/svg">
        <text
          x="10"
          y="50"
          font-size="40"
          font-family="Arial"
          font-weight="bold"
          stroke="var(--q)"
          fill="none"
          stroke-width="1.5"
          class="animated-text"
        >
          developer
        </text>
      </svg>
    </div>

    <load src="./partials/header.html" />

    <main>
      <load src="./partials/copy-deals.html" />
      <load src="./partials/numbers.html" />
      <load src="./partials/past-transactions.html" />
      <div class="container__about-company-free">
        <load src="./partials/about-company.html" />
        <load src="./partials/free.html" />
      </div>
      <load src="./partials/trade-blade.html" />
      <load src="./partials/how-use.html" />
      <load src="./partials/tariffs.html" />
      <load src="./partials/questions.html" />
    </main>

    <load src="./partials/footer.html" />

    <script type="module" src="./main.js"></script>
  </body>
</html>
