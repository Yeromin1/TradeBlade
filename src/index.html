<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/public/Logo.svg" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@2.0.0/modern-normalize.min.css"
    />

    <title>TradeBlade</title>

    <link rel="stylesheet" href="./css/styles.css" />

    <style>
      .preloader {
        background: black;
        left: 0;
        position: fixed;
        width: 100vw;
        height: 100vh;
        top: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .preloader svg {
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: drawText 1.5s ease forwards;
        text-transform: uppercase;
        overflow: visible;
      }

      @keyframes drawText {
        to {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="preloader">
      <svg
        viewBox="0 0 250 55"
        preserveAspectRatio="xMinYMid meet"
        xmlns="http://www.w3.org/2000/svg"
        style="overflow: visible; max-width: 260px"
      >
        <text
          x="10"
          y="30"
          font-size="40"
          font-family="'IBM Plex Sans', sans-serif"
          font-weight="700"
          stroke="var(--q)"
          fill="none"
          stroke-width="1.5"
          class="animated-text"
          dominant-baseline="middle"
          style="
            -webkit-font-smoothing: antialiased;
            paint-order: stroke fill;
            vector-effect: non-scaling-stroke;
            stroke-linejoin: round;
            stroke-linecap: round;
          "
        >
          Hello I AM
        </text>
      </svg>

      <svg
        viewBox="0 0 260 60"
        preserveAspectRatio="xMinYMid meet"
        xmlns="http://www.w3.org/2000/svg"
        style="overflow: visible; max-width: 280px"
      >
        <text
          x="10"
          y="30"
          font-size="40"
          font-family="'IBM Plex Sans', sans-serif"
          font-weight="700"
          stroke="var(--q)"
          fill="none"
          stroke-width="1.5"
          class="animated-text"
          dominant-baseline="middle"
          style="
            -webkit-font-smoothing: antialiased;
            paint-order: stroke fill;
            vector-effect: non-scaling-stroke;
            stroke-linejoin: round;
            stroke-linecap: round;
          "
        >
          TradeBlade
        </text>
      </svg>
    </div>

    <load src="./partials/header.html" />

    <main>
      <load src="./partials/copy-deals.html" />
      <load src="./partials/numbers.html" />
      <load src="./partials/past-transactions.html" />
      <div class="container__about-company-free">
        <load src="./partials/about-company.html" />
        <load src="./partials/free.html" />
      </div>
      <load src="./partials/trade-blade.html" />
      <load src="./partials/how-use.html" />
      <load src="./partials/tariffs.html" />
      <load src="./partials/questions.html" />
    </main>

    <load src="./partials/footer.html" />

    <script type="module" src="./main.js"></script>
  </body>
</html>
